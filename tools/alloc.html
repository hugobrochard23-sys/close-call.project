<!DOCTYPE html>
<!-- Outil de développement (jamais chargé par le jeu) : compte les objets mathématiques créés par image.
     Ouvrir tools/alloc.html?test=1&autopilot=1&fps=30&level=N, puis dans la console : __allocs(nImages). -->
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css"></head><body><div id="game"></div>
<script src="../assets/lib/three.min.js"></script>
<script>
  window.__count = {};
  for (const name of ['Vector3', 'Vector2', 'Quaternion', 'Matrix4', 'Matrix3', 'Euler', 'Color', 'Box3']) {
    const Base = THREE[name];
    THREE[name] = class extends Base { constructor(...a) { super(...a); __count[name] = (__count[name] || 0) + 1; } };
  }
  window.__allocs = (n) => {
    const snap = () => Object.assign({}, __count);
    const a = snap();
    for (let i = 0; i < n; i++) { CC.harness.step(1); if (CC.harness.state().done) break; }
    const b = snap(), out = {};
    let total = 0;
    for (const k in b) { const d = ((b[k] || 0) - (a[k] || 0)) / n; if (d) { out[k] = +d.toFixed(1); total += d; } }
    out.total = +total.toFixed(1);
    return out;
  };
</script>
